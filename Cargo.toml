[package]
name = "prism"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "PRISM — Prompt Reduction, Indexing & Semantic Memory. Enterprise token optimizer."
license = "AGPL-3.0-only"
authors = ["PRISM Team"]

[[bin]]
name = "prism"
path = "src/main.rs"

[lib]
name = "prism"
path = "src/lib.rs"

[features]
default = []

[dependencies]
# CLI & parsing
clap = { version = "=4.6.6", features = ["derive", "env"] }
colored = "=3.1.1"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# serde_yaml is deprecated upstream; serde_yaml_ng is the maintained drop-in fork.
# Aliased to the old crate name so every existing `use serde_yaml` / `serde_yaml::`
# call site keeps working unchanged.
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }

# Async runtime
tokio = { version = "=1.53.1", features = ["full"] }

# MCP server (rmcp: official Rust SDK)
rmcp = { version = "=3.2.0", features = ["server", "transport-streamable-http-server", "transport-io", "auth"] }
tokio-util = "=0.7.19"

# HTTP client + server (MCP transport)
axum = "=0.8.9"
reqwest = { version = "=0.13.5", features = ["json", "rustls"] }

# TLS for MITM proxy
rcgen = "=0.14.10"
rustls = { version = "=0.23.44", features = ["ring"] }
tokio-rustls = "=0.26.5"
rustls-pemfile = "=2.2.0"
webpki-roots = "=1.0.9"

# Vector index (TurboQuant — 10M docs/4GB, AVX-512BW SIMD)
turbovec = "=1.0.0"

# Token counting
tiktoken-rs = "=0.12.0"

# Database / persistence
sled = "=0.34.7"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Date/time
chrono = { version = "=0.4.45", features = ["serde"] }

# Image rightsizing (PNG codec: inflate/deflate + CRC32) — already in the tree
flate2 = "=1.1.10"

# Utilities
dirs = "=7.0.0"
regex = "=1.13.1"
walkdir = "=2.5.0"
petgraph = { version = "=0.8.3", features = ["serde-1"] }
sha2 = "=0.11.0"
# Real parsing for the codebase graph. Pinned exactly, like every other dependency
# here: a grammar bump changes node kind names and would silently stop matching.
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
# Static embeddings for memory search. `local-only` deliberately drops the `hf-hub`
# and `ureq` features: prism must never fetch a model at runtime, so a model is
# something the operator installs, not something the binary downloads.
model2vec-rs = { version = "=0.2.1", default-features = false, features = ["local-only", "fancy-regex"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
debug = true
