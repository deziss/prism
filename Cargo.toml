[package]
name = "prism"
version = "0.1.0"
edition = "2021"
description = "PRISM — Personal Reasoning & Intelligence System for Models. Enterprise token optimizer."
license = "MIT"
authors = ["PRISM Team"]

[[bin]]
name = "prism"
path = "src/main.rs"

[lib]
name = "prism"
path = "src/lib.rs"

[dependencies]
# CLI & parsing
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP server (proxy + MCP)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS for MITM proxy
rcgen = "0.12"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
webpki-roots = "0.26"

# Vector index (TurboQuant — 10M docs/4GB, AVX-512BW SIMD)
turbovec = "0.2"

# Token counting
tiktoken-rs = "0.6"

# Database / persistence
sled = "0.34"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
# Pin time to avoid rcgen/time 0.3.48 From trait coherence conflict (E0119)
time = "=0.3.36"

# Utilities
dirs = "5.0"
home = "0.5"
futures = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
walkdir = "2.5"
petgraph = "0.7"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
debug = true
