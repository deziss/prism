[package]
name = "prism"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "PRISM — Prompt Reduction, Indexing & Semantic Memory. Enterprise token optimizer."
license = "AGPL-3.0-only"
authors = ["PRISM Team"]

[[bin]]
name = "prism"
path = "src/main.rs"

[lib]
name = "prism"
path = "src/lib.rs"

[features]
default = []

[dependencies]
# CLI & parsing
clap = { version = "=4.6.6", features = ["derive", "env"] }
colored = "=3.1.1"
indicatif = "=0.18.6"
anyhow = "1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# serde_yaml is deprecated upstream; serde_yaml_ng is the maintained drop-in fork.
# Aliased to the old crate name so every existing `use serde_yaml` / `serde_yaml::`
# call site keeps working unchanged.
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
toml = "=1.1.5"

# Async runtime
tokio = { version = "=1.53.1", features = ["full"] }

# HTTP server (proxy + MCP)
axum = "0.8"
tower = "0.5"
tower-http = { version = "=0.7.1", features = ["cors", "compression-gzip", "trace"] }
reqwest = { version = "=0.13.5", features = ["json", "rustls"] }
hyper = { version = "=1.11.1", features = ["full"] }
hyper-util = { version = "=0.1.20", features = ["full"] }
http-body-util = "0.1"

# TLS for MITM proxy
rcgen = "=0.14.10"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
webpki-roots = "=1.0.9"

# Vector index (TurboQuant — 10M docs/4GB, AVX-512BW SIMD)
turbovec = "=1.0.0"

# Token counting
tiktoken-rs = "=0.12.0"

# Database / persistence
sled = "0.34"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = "=0.2.5"

# Date/time
chrono = { version = "=0.4.45", features = ["serde"] }

# Image rightsizing (PNG codec: inflate/deflate + CRC32) — already in the tree
flate2 = "=1.1.10"

# Utilities
dirs = "=7.0.0"
home = "0.5"
futures = "=0.3.34"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
regex = "=1.13.1"
walkdir = "=2.5.0"
petgraph = { version = "=0.8.3", features = ["serde-1"] }
sha2 = "=0.11.0"

[dev-dependencies]
criterion = "=0.8.2"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
debug = true
